<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Register — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D6;
    --paper-line: #C9BFA0;
    --margin-red: #8C2F39;
    --ink: #1F2A44;
    --ink-muted: #6B7690;
    --stamp-red: #B23A3A;
    --hole: #D8CFB6;
    --hole-shadow: #B7AC8E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #2b2620;
    background-image: radial-gradient(circle at 50% 0%, #3a332a 0%, #201c17 70%);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    justify-content: center;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 440px;
    padding: 24px;
  }

  .ledger {
    position: relative;
    width: 100%;
    background:
      repeating-linear-gradient(
        var(--paper),
        var(--paper) 35px,
        var(--paper-line) 36px
      );
    border-radius: 3px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.15);
    padding: 40px 40px 40px 76px;
    overflow: hidden;
  }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 52px;
    width: 2px;
    background: var(--margin-red);
    opacity: 0.75;
  }

  .holes {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 24px;
    width: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 30px 0;
  }

  .hole {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--hole);
    box-shadow: inset 0 1px 2px var(--hole-shadow), 0 1px 0 rgba(255,255,255,0.4);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }

  .underline {
    width: 54px;
    height: 3px;
    background: var(--stamp-red);
    margin: 10px 0 28px;
  }

  .row {
    margin-bottom: 26px;
  }

  .row label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }

  .row input {
    width: 100%;
    border: none;
    background: transparent;
    border-bottom: 1px solid var(--ink-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--ink);
    padding: 4px 2px 8px;
    transition: letter-spacing 0.2s ease, color 0.2s ease;
  }

  .row input:focus {
    outline: none;
    border-bottom: 1.5px solid var(--stamp-red);
  }

  .row input::placeholder {
    color: #A8A08C;
  }

  .row input.writing {
    animation: inkStroke 0.28s ease-out;
  }

  @keyframes inkStroke {
    0% {
      color: var(--stamp-red);
      letter-spacing: 0.06em;
      text-shadow: 0 0 6px rgba(178, 58, 58, 0.35);
    }
    100% {
      color: var(--ink);
      letter-spacing: 0.01em;
      text-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .row input.writing { animation: none; }
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 34px;
  }

  button {
    position: relative;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: none;
    padding: 13px 26px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  button:active:not(:disabled) {
    transform: translateY(0px) scale(0.98);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--stamp-red);
    min-height: 16px;
  }

  .stamp-wrap {
    position: absolute;
    top: 36px;
    right: 34px;
    width: 92px;
    height: 92px;
    pointer-events: none;
    opacity: 0;
    transform: scale(1.6) rotate(-18deg);
  }

  .stamp-wrap.show {
    animation: stampIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.1) forwards;
  }

  @keyframes stampIn {
    0% { opacity: 0; transform: scale(1.7) rotate(-22deg); }
    60% { opacity: 0.9; transform: scale(0.92) rotate(-9deg); }
    100% { opacity: 0.85; transform: scale(1) rotate(-11deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp-wrap.show { animation: none; opacity: 0.85; transform: scale(1) rotate(-11deg); }
    button { transition: none; }
  }

  .profile-panel {
    display: none;
    width: 100%;
    background: var(--paper);
    border-radius: 3px;
    padding: 28px 30px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }

  .profile-panel .eyebrow {
    margin-bottom: 6px;
  }

  .profile-panel .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .profile-panel h2 {
    font-family: 'Zilla Slab', serif;
    font-size: 18px;
    margin: 0;
  }

  .profile-panel img[src*="/api/photo"] {
    display: block;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--stamp-red);
    margin: 0 auto 18px;
  }

  .coming-soon-note {
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-muted);
  }

  /* --- Profile fields: icon-led rows in a bordered card,
     replacing the raw injected SRM table --- */
  .profile-fields {
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }

  .profile-field {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--paper-line);
  }

  .profile-field:last-child {
    border-bottom: none;
  }

  .profile-field-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    color: var(--ink-muted);
  }

  .profile-field-icon svg {
    width: 100%;
    height: 100%;
  }

  .profile-field-body {
    font-size: 13px;
    line-height: 1.55;
    word-break: break-word;
    overflow-wrap: break-word;
    min-width: 0;
  }

  .profile-field-label {
    color: var(--ink-muted);
  }

  .profile-field-value {
    font-weight: 700;
    color: var(--ink);
  }

  /* --- Full-width app header, sits above .page, not
     constrained by its 440px max-width --- */
  .app-header {
    display: none;
    position: sticky;
    top: 0;
    width: 100%;
    background: #201c17;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    z-index: 20;
  }

  .app-header.visible {
    display: block;
  }

  .app-header-inner {
    max-width: 600px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
    color: var(--stamp-red);
  }

  .brand-logo svg {
    width: 100%;
    height: 100%;
  }

  .brand-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--paper);
    text-transform: uppercase;
  }

  .hamburger-btn {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    border: none;
    background: rgba(237, 230, 214, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--paper);
    padding: 0;
  }

  .hamburger-btn:hover {
    background: rgba(237, 230, 214, 0.16);
  }

  .hamburger-btn svg {
    width: 20px;
    height: 20px;
  }

  .hamburger-menu {
    position: absolute;
    top: 54px;
    right: 20px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.4);
    display: none;
    flex-direction: column;
    min-width: 190px;
    overflow: hidden;
    z-index: 10;
  }

  .hamburger-menu.open {
    display: flex;
  }

  .menu-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-align: left;
    padding: 13px 16px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--paper-line);
    color: var(--ink);
    cursor: pointer;
  }

  .menu-item:last-child {
    border-bottom: none;
  }

  .menu-item:hover:not(:disabled) {
    background: rgba(140, 47, 57, 0.08);
  }

  .menu-item:disabled {
    color: var(--ink-muted);
    cursor: not-allowed;
  }

  .menu-item.logout {
    color: var(--stamp-red);
  }

  #attendanceSection {
    display: none;
  }

  .attendance-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .subject-card {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 16px 18px;
  }

  .subject-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .subject-name {
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
  }

  .subject-percent {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 17px;
  }

  .subject-percent.good { color: #3B6B4A; }
  .subject-percent.low { color: var(--stamp-red); }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--paper-line);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
  }

  .progress-fill.good { background: #3B6B4A; }
  .progress-fill.low { background: var(--stamp-red); }

  .subject-minmax {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-muted);
    margin-bottom: 14px;
  }

  .subject-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-box {
    background: var(--paper);
    border-radius: 3px;
    padding: 8px 10px;
  }

  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }

  .stat-value.present { color: #3B6B4A; }
  .stat-value.absent { color: var(--stamp-red); }

  @media (max-width: 480px) {
    .page {
      max-width: 100%;
      gap: 0;
      padding: 0;
    }

    .ledger {
      border-radius: 0;
      box-shadow: none;
      padding: 34px 20px 34px 58px;
      margin: 24px 0 0;
    }

    .margin-rule {
      left: 36px;
    }

    .holes {
      left: 14px;
    }

    .stamp-wrap {
      width: 64px;
      height: 64px;
      top: 18px;
      right: 16px;
    }

    .profile-panel {
      border-radius: 0;
      box-shadow: none;
      padding: 20px 18px;
    }

    h1 {
      font-size: 22px;
    }

    .profile-field {
      padding: 12px 14px;
    }
  }
</style>
</head>
<body>

  <div id="appHeader" class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/>
            <path d="M9 12l2 2 4-4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">SRM AP</span>
      </div>
      <button id="hamburgerBtn" class="hamburger-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <div id="hamburgerMenu" class="hamburger-menu">
        <button class="menu-item" data-action="profile" type="button">Profile</button>
        <button class="menu-item" data-action="attendance" type="button">Attendance</button>
        <button class="menu-item" data-action="markAttendance" type="button" disabled>Mark Attendance (soon)</button>
        <button class="menu-item logout" data-action="logout" type="button">Logout</button>
      </div>
    </div>
  </div>

  <div class="page">

    <div class="ledger">
      <div class="holes">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
      </div>
      <div class="margin-rule"></div>

      <svg class="stamp-wrap" id="stamp" viewBox="0 0 100 100">
        <defs>
          <filter id="grunge">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2"/>
          </filter>
        </defs>
        <g filter="url(#grunge)" fill="none" stroke="#B23A3A" stroke-width="2.4">
          <circle cx="50" cy="50" r="42"/>
          <circle cx="50" cy="50" r="34" stroke-width="1.4"/>
          <text x="50" y="47" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#B23A3A" stroke="none" letter-spacing="1">VERIFIED</text>
          <text x="50" y="62" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7" fill="#B23A3A" stroke="none" letter-spacing="2">SRM · AP</text>
        </g>
      </svg>

      <p class="eyebrow">Roll Call Register</p>
      <h1>Student Login</h1>
      <div class="underline"></div>

      <form id="loginForm">
        <div class="row">
          <label for="username">Registration No.</label>
          <input id="username" name="username" type="text" placeholder="AP2XXXXXXXXXXXX" autocomplete="username" required>
        </div>

        <div class="row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="actions">
          <button id="loginBtn" type="submit">Login</button>
          <span id="status" class="status"></span>
        </div>
      </form>
    </div>

    <div id="profileSection" class="profile-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Register Entry</p>
          <h2>Profile</h2>
        </div>
      </div>
      <div id="profileContent"></div>
      <p class="coming-soon-note">Complete Portal Loading Soon....</p>
    </div>

    <div id="attendanceSection" class="profile-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Roll Call Record</p>
          <h2>Attendance</h2>
        </div>
      </div>
      <div id="attendanceContent"></div>
    </div>

  </div>

  <script>
    // Same-origin now — the frontend is served by the same Express
    // app it talks to, so this just resolves to wherever the page
    // itself was loaded from. Works unchanged on localhost and once
    // deployed, no hardcoded URL to update between environments.
    const API_BASE = window.location.origin;

    let sessionId = null;

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const status = document.getElementById('status');
    const stamp = document.getElementById('stamp');
    const inputs = document.querySelectorAll('.row input');
    const profileSection = document.getElementById('profileSection');
    const profileContent = document.getElementById('profileContent');
    const ledger = document.querySelector('.ledger');
    const appHeader = document.getElementById('appHeader');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const hamburgerMenu = document.getElementById('hamburgerMenu');
    const attendanceSection = document.getElementById('attendanceSection');
    const attendanceContent = document.getElementById('attendanceContent');

    // --- Icon set for profile fields (plain inline SVG, no external
    // icon library needed). Each is a small 24x24 stroke icon. ---
    const FIELD_ICONS = {
      user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
      building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18"/><path d="M9 21v-4h6v4M9 7h1M9 11h1M14 7h1M14 11h1"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
      folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 3h10v11H3z"/></svg>',
      graduation: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 006 6L16 14l5 2v4c0 1-1 2-2 2A16 16 0 013 6c0-1 1-2 2-2z"/></svg>',
      family: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><circle cx="17" cy="8" r="2.5"/><path d="M22 20c0-2.5-1.8-4.3-4-5"/></svg>',
      globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/></svg>'
    };

    // Matches a field's label text (from SRM's own table) to an
    // icon — checked in order, first match wins. Falls back to a
    // generic file icon for anything unrecognized, so new/renamed
    // SRM fields never break rendering, they just get a plain icon.
    const getFieldIcon = (label) => {
      const lower = label.toLowerCase();
      if (lower.includes('father') || lower.includes('mother')) return FIELD_ICONS.family;
      if (lower.includes('name')) return FIELD_ICONS.user;
      if (lower.includes('register')) return FIELD_ICONS.file;
      if (lower.includes('institution')) return FIELD_ICONS.building;
      if (lower.includes('semester') || lower.includes('d.o.b') || lower.includes('dob')) return FIELD_ICONS.calendar;
      if (lower.includes('program') || lower.includes('section')) return FIELD_ICONS.folder;
      if (lower.includes('specialization')) return FIELD_ICONS.graduation;
      if (lower.includes('contact') || lower.includes('email') || lower.includes('phone')) return FIELD_ICONS.phone;
      if (lower.includes('access')) return FIELD_ICONS.globe;
      return FIELD_ICONS.file;
    };

    // SRM sends the profile as a plain HTML <table> (label cell,
    // sometimes a ":" cell, then a value cell per row). This reads
    // that raw table and pulls out clean {label, value} pairs so we
    // can render our own icon-led cards instead of their table
    // markup — same underlying data, our own presentation.
    const parseProfileFields = (tableHtml) => {
      const doc = new DOMParser().parseFromString(tableHtml, 'text/html');
      const rows = doc.querySelectorAll('tr');
      const fields = [];

      rows.forEach((row) => {
        const cells = Array.from(row.querySelectorAll('td'))
          .filter((cell) => cell.textContent.trim() !== '' && cell.textContent.trim() !== ':');

        if (cells.length < 2) return;

        const label = cells[0].textContent.trim().replace(/:$/, '');
        const value = cells.slice(1).map((cell) => cell.innerHTML.trim()).join(' ').trim();

        if (label && value) {
          fields.push({ label, value });
        }
      });

      return fields;
    };

    const renderProfileFields = (fields) => {
      if (fields.length === 0) {
        return '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ink-muted);">No profile data found.</p>';
      }

      const rowsHtml = fields.map((field) => `
        <div class="profile-field">
          <span class="profile-field-icon">${getFieldIcon(field.label)}</span>
          <span class="profile-field-body">
            <span class="profile-field-label">${field.label}:</span>
            <span class="profile-field-value">${field.value}</span>
          </span>
        </div>
      `).join('');

      return `<div class="profile-fields">${rowsHtml}</div>`;
    };

    // The server response is the photo <img> tag followed by SRM's
    // raw report table, concatenated into one string — this splits
    // them apart so each can be handled on its own terms (the photo
    // tag is session-specific and never cached; the table is parsed
    // into our own card layout).
    const splitPhotoAndTable = (html) => {
      const match = html.match(/<img[^>]*>/i);
      const photoTag = match ? match[0] : '';
      const tableHtml = html.replace(/<img[^>]*>/i, '');
      return { photoTag, tableHtml };
    };

    const renderProfileDisplay = (tableHtml, photoTag) => {
      const fields = parseProfileFields(tableHtml);
      return photoTag + renderProfileFields(fields);
    };

    const renderAttendance = (subjects) => {
      if (!subjects || subjects.length === 0) {
        attendanceContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ink-muted);">No attendance data found.</p>';
        return;
      }

      const cardsHtml = subjects.map((subject) => {
        const isGood = subject.attendancePercent >= 75;
        const statusClass = isGood ? 'good' : 'low';
        const barWidth = Math.min(100, Math.max(0, subject.attendancePercent));

        return `
          <div class="subject-card">
            <div class="subject-card-header">
              <span class="subject-name">${subject.description}</span>
              <span class="subject-percent ${statusClass}">${subject.attendancePercent}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill ${statusClass}" style="width:${barWidth}%"></div>
            </div>
            <div class="subject-minmax">
              <span>Min: 75%</span>
              <span>Current: ${subject.attendancePercent}%</span>
            </div>
            <div class="subject-stats">
              <div class="stat-box">
                <div class="stat-label">Present</div>
                <div class="stat-value present">${subject.present}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Absent</div>
                <div class="stat-value absent">${subject.absent}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Total</div>
                <div class="stat-value">${subject.total}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Can Skip</div>
                <div class="stat-value">${subject.canSkip}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      attendanceContent.innerHTML = `<div class="attendance-grid">${cardsHtml}</div>`;
    };

    const loadAttendance = async () => {
      attendanceContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ink-muted);">Loading attendance...</p>';
      profileSection.style.display = 'none';
      attendanceSection.style.display = 'block';

      try {
        const res = await fetch(`${API_BASE}/api/attendance`, {
          headers: { 'X-Client-Session': sessionId }
        });

        if (!res.ok) {
          attendanceContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--stamp-red);">Could not load attendance.</p>';
          return;
        }

        const subjects = await res.json();
        renderAttendance(subjects);
      } catch (err) {
        attendanceContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--stamp-red);">Could not load attendance.</p>';
      }
    };


    inputs.forEach((input) => {
      let timer;
      input.addEventListener('input', () => {
        input.classList.remove('writing');
        void input.offsetWidth;
        input.classList.add('writing');
        clearTimeout(timer);
        timer = setTimeout(() => input.classList.remove('writing'), 280);
      });
    });

    const initSession = async () => {
      try {
        const res = await fetch(`${API_BASE}/api/session`);
        sessionId = res.headers.get('x-client-session');
      } catch (err) {
        console.error('Failed to initialize session:', err);
        status.textContent = 'Could not reach server';
      }
    };

    // Runs once on page load. If a previous login left a session id
    // in sessionStorage, try reusing it instead of always starting
    // fresh — this is what makes a refresh not look like a logout.
    // sessionStorage (not localStorage) is deliberate: it survives a
    // refresh but clears when the tab actually closes, which matches
    // what "staying logged in" should mean here.
    const restoreSession = async () => {
      const storedSessionId = sessionStorage.getItem('sessionId');
      const storedUsername = sessionStorage.getItem('username');

      if (!storedSessionId || !storedUsername) {
        await initSession();
        return;
      }

      sessionId = storedSessionId;

      try {
        const res = await fetch(`${API_BASE}/api/profile`, {
          headers: { 'X-Client-Session': sessionId }
        });

        if (!res.ok) {
          throw new Error('Stored session no longer valid');
        }

        ledger.style.display = 'none';
        appHeader.classList.add('visible');
        await loadProfile(storedUsername);

      } catch (err) {
        // The stored session expired or was never valid server-side
        // (e.g. the server restarted) — clear it and fall back to a
        // fresh anonymous session, same as a first-time visit.
        sessionStorage.removeItem('sessionId');
        sessionStorage.removeItem('username');
        sessionId = null;
        await initSession();
      }
    };

    // How long a localStorage copy stays "fresh" before we treat it
    // as stale and only trust a fresh fetch — keeps it roughly in
    // step with the server's own 15-minute cache window.
    const CACHE_TTL_MS = 15 * 60 * 1000;

    // Cache stores the RAW table HTML only (never the photo tag, and
    // never our rendered card HTML) — rendering always happens fresh
    // from this source data, whether it came from cache or a live
    // fetch. That keeps presentation logic in one place.
    const readCachedProfile = (username) => {
      const raw = localStorage.getItem(`profile:${username}`);
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        const age = Date.now() - parsed.fetchedAt;
        if (age > CACHE_TTL_MS) return null;
        return parsed.tableHtml;
      } catch (err) {
        return null;
      }
    };

    const writeCachedProfile = (username, tableHtml) => {
      localStorage.setItem(`profile:${username}`, JSON.stringify({
        tableHtml,
        fetchedAt: Date.now()
      }));
    };

    // Stale-while-revalidate: if we have a fresh local copy, show it
    // immediately (feels instant, zero network wait — though without
    // a photo, since that's session-specific and never cached) —
    // then still quietly fetch the real thing in the background and
    // swap it in once it arrives, complete with a fresh photo.
    const loadProfile = async (username) => {
      const cachedTableHtml = readCachedProfile(username);

      if (cachedTableHtml) {
        profileContent.innerHTML = renderProfileDisplay(cachedTableHtml, '');
        profileSection.style.display = 'block';
      } else {
        profileContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ink-muted);">Loading profile...</p>';
        profileSection.style.display = 'block';
      }

      try {
        const res = await fetch(`${API_BASE}/api/profile`, {
          headers: { 'X-Client-Session': sessionId }
        });

        if (!res.ok) {
          if (!cachedTableHtml) {
            profileContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--stamp-red);">Could not load profile.</p>';
          }
          return;
        }

        const html = await res.text();
        const { photoTag, tableHtml } = splitPhotoAndTable(html);

        profileContent.innerHTML = renderProfileDisplay(tableHtml, photoTag);
        writeCachedProfile(username, tableHtml);
      } catch (err) {
        // Network hiccup fetching the fresh copy — if we already
        // showed a cached version, just leave it up rather than
        // replacing it with an error.
        if (!cachedTableHtml) {
          profileContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--stamp-red);">Could not load profile.</p>';
        }
      }
    };

    restoreSession();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!sessionId) {
        status.textContent = 'Session not ready yet, try again in a moment';
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Checking...';
      status.textContent = '';
      status.style.color = 'var(--stamp-red)';
      stamp.classList.remove('show');
      profileSection.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Client-Session': sessionId
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed');
        }

        status.textContent = 'Entry recorded';
        status.style.color = '#3B6B4A';
        stamp.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Login';

        sessionStorage.setItem('sessionId', sessionId);
        sessionStorage.setItem('username', username);

        ledger.style.display = 'none';
        appHeader.classList.add('visible');
        await loadProfile(username);

      } catch (err) {
        status.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
    hamburgerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hamburgerMenu.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!hamburgerMenu.contains(e.target) && e.target !== hamburgerBtn) {
        hamburgerMenu.classList.remove('open');
      }
    });

    hamburgerMenu.addEventListener('click', async (e) => {
      const action = e.target.dataset.action;
      if (!action) return;

      hamburgerMenu.classList.remove('open');

      if (action === 'profile') {
        attendanceSection.style.display = 'none';
        profileSection.style.display = 'block';
      } else if (action === 'attendance') {
        await loadAttendance();
      } else if (action === 'logout') {
        try {
          await fetch(`${API_BASE}/api/logout`, {
            method: 'POST',
            headers: { 'X-Client-Session': sessionId }
          });
        } catch (err) {
          console.error('Logout error:', err);
        }

        sessionStorage.removeItem('sessionId');
        sessionStorage.removeItem('username');

        sessionId = null;
        profileSection.style.display = 'none';
        attendanceSection.style.display = 'none';
        appHeader.classList.remove('visible');
        profileContent.innerHTML = '';
        ledger.style.display = 'block';
        status.textContent = '';
        form.reset();

        await initSession();
      }
    });
  </script>

</body>
</html>
