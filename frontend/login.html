<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Register — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D6;
    --paper-line: #C9BFA0;
    --margin-red: #8C2F39;
    --ink: #1F2A44;
    --ink-muted: #6B7690;
    --stamp-red: #B23A3A;
    --hole: #D8CFB6;
    --hole-shadow: #B7AC8E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2b2620;
    background-image: radial-gradient(circle at 50% 0%, #3a332a 0%, #201c17 70%);
    font-family: 'Inter', sans-serif;
    padding: 24px;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 440px;
  }

  .ledger {
    position: relative;
    width: 100%;
    background:
      repeating-linear-gradient(
        var(--paper),
        var(--paper) 35px,
        var(--paper-line) 36px
      );
    border-radius: 3px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.15);
    padding: 40px 40px 40px 76px;
    overflow: hidden;
  }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 52px;
    width: 2px;
    background: var(--margin-red);
    opacity: 0.75;
  }

  .holes {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 24px;
    width: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 30px 0;
  }

  .hole {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--hole);
    box-shadow: inset 0 1px 2px var(--hole-shadow), 0 1px 0 rgba(255,255,255,0.4);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }

  .underline {
    width: 54px;
    height: 3px;
    background: var(--stamp-red);
    margin: 10px 0 28px;
  }

  .row {
    margin-bottom: 26px;
  }

  .row label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }

  .row input {
    width: 100%;
    border: none;
    background: transparent;
    border-bottom: 1px solid var(--ink-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--ink);
    padding: 4px 2px 8px;
    transition: letter-spacing 0.2s ease, color 0.2s ease;
  }

  .row input:focus {
    outline: none;
    border-bottom: 1.5px solid var(--stamp-red);
  }

  .row input::placeholder {
    color: #A8A08C;
  }

  .row input.writing {
    animation: inkStroke 0.28s ease-out;
  }

  @keyframes inkStroke {
    0% {
      color: var(--stamp-red);
      letter-spacing: 0.06em;
      text-shadow: 0 0 6px rgba(178, 58, 58, 0.35);
    }
    100% {
      color: var(--ink);
      letter-spacing: 0.01em;
      text-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .row input.writing { animation: none; }
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 34px;
  }

  button {
    position: relative;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: none;
    padding: 13px 26px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  button:active:not(:disabled) {
    transform: translateY(0px) scale(0.98);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--stamp-red);
    min-height: 16px;
  }

  .stamp-wrap {
    position: absolute;
    top: 36px;
    right: 34px;
    width: 92px;
    height: 92px;
    pointer-events: none;
    opacity: 0;
    transform: scale(1.6) rotate(-18deg);
  }

  .stamp-wrap.show {
    animation: stampIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.1) forwards;
  }

  @keyframes stampIn {
    0% { opacity: 0; transform: scale(1.7) rotate(-22deg); }
    60% { opacity: 0.9; transform: scale(0.92) rotate(-9deg); }
    100% { opacity: 0.85; transform: scale(1) rotate(-11deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp-wrap.show { animation: none; opacity: 0.85; transform: scale(1) rotate(-11deg); }
    button { transition: none; }
  }

  .profile-panel {
    display: none;
    width: 100%;
    background: var(--paper);
    border-radius: 3px;
    padding: 28px 30px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }

  .profile-panel .eyebrow {
    margin-bottom: 6px;
  }

  .profile-panel .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .logout-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stamp-red);
    background: transparent;
    border: 1px solid var(--stamp-red);
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .logout-btn:hover {
    background: var(--stamp-red);
    color: var(--paper);
  }

  .profile-panel h2 {
    font-family: 'Zilla Slab', serif;
    font-size: 18px;
    margin: 0;
  }

  .profile-panel img[src*="/api/photo"] {
    display: block;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--stamp-red);
    margin: 0 auto 18px;
  }

  .coming-soon-note {
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-muted);
  }

  .profile-panel table {
    width: 100% !important;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }

  .profile-panel td {
    padding: 9px 6px;
    border-bottom: 1px solid var(--paper-line);
    vertical-align: top;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  /* SRM's raw table markup sometimes carries its own inline widths
     from the old portal's layout — this forces every element inside
     the injected profile HTML to respect our container's width
     instead of pushing it wider than the screen. overflow-x here is
     a safety net: if something still doesn't fit, it scrolls inside
     this card instead of stretching the whole page sideways (which
     is what was cutting text off at the right edge on mobile). */
  .profile-panel {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .profile-panel * {
    max-width: 100%;
    box-sizing: border-box;
  }

  body {
    overflow-x: hidden;
  }

  @media (max-width: 480px) {
    .ledger { padding: 34px 24px 34px 62px; }
    .margin-rule { left: 40px; }
    .holes { left: 16px; }
    .stamp-wrap { width: 70px; height: 70px; top: 22px; right: 20px; }
    .profile-panel { padding: 22px 16px; }
    .profile-panel td { font-size: 12px; padding: 8px 4px; }
  }
</style>
</head>
<body>

  <div class="page">

    <div class="ledger">
      <div class="holes">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
      </div>
      <div class="margin-rule"></div>

      <svg class="stamp-wrap" id="stamp" viewBox="0 0 100 100">
        <defs>
          <filter id="grunge">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2"/>
          </filter>
        </defs>
        <g filter="url(#grunge)" fill="none" stroke="#B23A3A" stroke-width="2.4">
          <circle cx="50" cy="50" r="42"/>
          <circle cx="50" cy="50" r="34" stroke-width="1.4"/>
          <text x="50" y="47" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#B23A3A" stroke="none" letter-spacing="1">VERIFIED</text>
          <text x="50" y="62" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7" fill="#B23A3A" stroke="none" letter-spacing="2">SRM · AP</text>
        </g>
      </svg>

      <p class="eyebrow">Roll Call Register</p>
      <h1>Student Login</h1>
      <div class="underline"></div>

      <form id="loginForm">
        <div class="row">
          <label for="username">Registration No.</label>
          <input id="username" name="username" type="text" placeholder="AP2XXXXXXXXXXXX" autocomplete="username" required>
        </div>

        <div class="row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="actions">
          <button id="loginBtn" type="submit">Login</button>
          <span id="status" class="status"></span>
        </div>
      </form>
    </div>

    <div id="profileSection" class="profile-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Register Entry</p>
          <h2>Profile</h2>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>
      <div id="profileContent"></div>
      <p class="coming-soon-note">Complete Portal Loading Soon....</p>
    </div>

  </div>

  <script>
    // Same-origin now — the frontend is served by the same Express
    // app it talks to, so this just resolves to wherever the page
    // itself was loaded from. Works unchanged on localhost and once
    // deployed, no hardcoded URL to update between environments.
    const API_BASE = window.location.origin;

    let sessionId = null;

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const status = document.getElementById('status');
    const stamp = document.getElementById('stamp');
    const inputs = document.querySelectorAll('.row input');
    const profileSection = document.getElementById('profileSection');
    const profileContent = document.getElementById('profileContent');
    const ledger = document.querySelector('.ledger');
    const logoutBtn = document.getElementById('logoutBtn');

    inputs.forEach((input) => {
      let timer;
      input.addEventListener('input', () => {
        input.classList.remove('writing');
        void input.offsetWidth;
        input.classList.add('writing');
        clearTimeout(timer);
        timer = setTimeout(() => input.classList.remove('writing'), 280);
      });
    });

    const initSession = async () => {
      try {
        const res = await fetch(`${API_BASE}/api/session`);
        sessionId = res.headers.get('x-client-session');
      } catch (err) {
        console.error('Failed to initialize session:', err);
        status.textContent = 'Could not reach server';
      }
    };

    // How long a localStorage copy stays "fresh" before we treat it
    // as stale and only trust a fresh fetch — keeps it roughly in
    // step with the server's own 15-minute cache window.
    const CACHE_TTL_MS = 15 * 60 * 1000;

    const readCachedProfile = (username) => {
      const raw = localStorage.getItem(`profile:${username}`);
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        const age = Date.now() - parsed.fetchedAt;
        if (age > CACHE_TTL_MS) return null;
        return parsed.html;
      } catch (err) {
        return null;
      }
    };

    const writeCachedProfile = (username, html) => {
      // Strip the photo <img> tag before caching — its src encodes
      // the CURRENT session's id, which is gone by the next login.
      // We'd rather show no photo for a split second (until the
      // background revalidation fetch lands with a fresh tag) than
      // show a guaranteed-broken image pointing at an old session.
      const htmlWithoutPhoto = html.replace(/<img[^>]*>/i, '');

      localStorage.setItem(`profile:${username}`, JSON.stringify({
        html: htmlWithoutPhoto,
        fetchedAt: Date.now()
      }));
    };

    // Stale-while-revalidate: if we have a fresh local copy, show it
    // immediately (feels instant, zero network wait) — then still
    // quietly fetch the real thing in the background and swap it in
    // once it arrives, so the data never gets stuck stale for long.
    const loadProfile = async (username) => {
      const cachedHtml = readCachedProfile(username);

      if (cachedHtml) {
        profileContent.innerHTML = cachedHtml;
        profileSection.style.display = 'block';
      } else {
        profileContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ink-muted);">Loading profile...</p>';
        profileSection.style.display = 'block';
      }

      try {
        const res = await fetch(`${API_BASE}/api/profile`, {
          headers: { 'X-Client-Session': sessionId }
        });

        if (!res.ok) {
          if (!cachedHtml) {
            profileContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--stamp-red);">Could not load profile.</p>';
          }
          return;
        }

        const html = await res.text();
        profileContent.innerHTML = html;
        writeCachedProfile(username, html);
      } catch (err) {
        // Network hiccup fetching the fresh copy — if we already
        // showed a cached version, just leave it up rather than
        // replacing it with an error.
        if (!cachedHtml) {
          profileContent.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--stamp-red);">Could not load profile.</p>';
        }
      }
    };

    initSession();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!sessionId) {
        status.textContent = 'Session not ready yet, try again in a moment';
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Checking...';
      status.textContent = '';
      status.style.color = 'var(--stamp-red)';
      stamp.classList.remove('show');
      profileSection.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Client-Session': sessionId
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed');
        }

        status.textContent = 'Entry recorded';
        status.style.color = '#3B6B4A';
        stamp.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Login';

        ledger.style.display = 'none';
        await loadProfile(username);

      } catch (err) {
        status.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch(`${API_BASE}/api/logout`, {
          method: 'POST',
          headers: { 'X-Client-Session': sessionId }
        });
      } catch (err) {
        console.error('Logout error:', err);
      }

      sessionId = null;
      profileSection.style.display = 'none';
      profileContent.innerHTML = '';
      ledger.style.display = 'block';
      status.textContent = '';
      form.reset();

      await initSession();
    });
  </script>

</body>
</html>
