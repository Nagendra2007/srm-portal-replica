# Optimized Nginx Configuration for 1 Core, 1GB RAM Node.js Reverse Proxy
user nginx;
worker_processes 1; # Constrain to 1 worker since we are on a 1 Core CPU

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024; # Standard limit for single worker
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging Settings (Buffered logs for low CPU overhead)
    access_log /var/log/nginx/access.log main buffer=16k flush=2m;

    # Basic Optimization Settings
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off; # Security: Hide Nginx version

    # ==========================================
    # GZIP COMPRESSION CONFIGURATION
    # ==========================================
    gzip on;
    gzip_disable "msie6"; # Disable for legacy Internet Explorer 6

    gzip_vary on;         # Ask proxies to cache both gzipped and regular versions of assets
    gzip_proxied any;     # Compress responses for all proxied requests
    gzip_comp_level 5;    # Balanced level 5 (Optimal CPU vs compression ratio, max CPU is 9 but uses too much memory/cycle)
    gzip_min_length 256;  # Don't compress assets smaller than 256 bytes (saves useless CPU cycles)

    # Compress all standard web asset types (HTML is compressed by default)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================
    # REVERSE PROXY TO NODE.JS SERVER
    # ==========================================
    server {
        listen 80;
        server_name localhost; # Replace with your domain name or IP

        # Frontend assets caching header to save server bandwidth & CPU
        location / {
            proxy_pass http://127.0.0.1:3000; # Forward requests to your Node.js app
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward real client IP addresses
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache control for assets to offload Node.js responses
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
            proxy_pass http://127.0.0.1:3000;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable"; # 30 Days cache
        }
    }
}
