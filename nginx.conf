# Nginx reverse proxy for the SRM portal replica — 1 core / 1 GB RAM.
user nginx;
worker_processes auto;          # 'auto' matches core count; still 1 on a 1-core box,
                                # but correct if the instance is ever resized.
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # FIX: the previous config referenced `main` without defining it. When this
    # file replaces the top-level nginx.conf there is no inherited log_format,
    # so nginx refused to start with:
    #   [emerg] unknown log format "main"
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ==========================================
    # COMPRESSION
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;

    # text/html is always compressed when gzip is on and cannot be listed here.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    # ==========================================
    # RATE LIMITING
    # Node has its own limiter, but stopping a flood at the edge means the
    # event loop never sees it.
    # ==========================================
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=120r/m;
    limit_req_status 429;

    # ==========================================
    # UPSTREAM
    # FIX: without an upstream keepalive pool, every proxied request opened a
    # fresh TCP connection to Node and closed it again.
    # ==========================================
    upstream node_app {
        server 127.0.0.1:3000;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # Only send Connection: upgrade when the client actually asked to upgrade.
    # FIX: the old config hard-coded it on every request, which defeats
    # upstream keep-alive. This app has no WebSocket endpoints at all.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        server_name _;            # replace with your domain

        # ------------------------------------------------------------------
        # This app collects real SRM usernames and passwords. On plain HTTP
        # they cross the network in cleartext. Terminate TLS here before any
        # real student uses it — certbot will fill this in for you:
        #
        #   listen 443 ssl http2;
        #   ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
        #   ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
        #   ssl_protocols TLSv1.2 TLSv1.3;
        #   ssl_session_cache shared:SSL:10m;
        #   add_header Strict-Transport-Security "max-age=31536000" always;
        #
        # ...and turn this server block into a redirect:
        #   return 301 https://$host$request_uri;
        # ------------------------------------------------------------------

        client_max_body_size 1m;

        # Defence in depth; Node sets these too, but the proxy is the last hop.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /api/login {
            limit_req zone=login_zone burst=5 nodelay;

            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Login does OCR plus several round-trips to SRM, so it is slow
            # by nature — but not unbounded.
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    45s;
        }

        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;

            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    45s;

            # API responses are per-student; never let a proxy cache them.
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location / {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets. Node already sends 30-day max-age, so this block only
        # silences the access log for them.
        # NOTE: the old config forced `immutable` here. That is only safe with
        # content-hashed filenames — with plain names like app.js a returning
        # visitor can be stuck on a stale file for 30 days. Left off on purpose.
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|mp4|webm)$ {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
